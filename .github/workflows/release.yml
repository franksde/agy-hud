name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code dist/
      - name: Verify the tag matches every version source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./plugin.json').version")
          bundle=$(node dist/agy-hud.js version)
          echo "tag=$tag package.json=$pkg plugin.json=$plugin bundle=$bundle"
          for found in "$pkg" "$plugin" "$bundle"; do
            if [ "$found" != "$tag" ]; then
              echo "::error::tag v$tag does not match $found; refusing to publish a mislabeled release"
              exit 1
            fi
          done
      - name: Build archive
        run: |
          package="agy-hud"
          mkdir -p "release/${package}/hooks" "release/${package}/dist" "release/${package}/docs"
          cp plugin.json config.example.json README.md README.zh-CN.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md "release/${package}/"
          cp hooks/status-line.sh "release/${package}/hooks/"
          cp dist/agy-hud.js "release/${package}/dist/"
          cp docs/hud-preview.png "release/${package}/docs/"
          tar -czf "${package}.tar.gz" -C release "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: agy-hud
          path: agy-hud.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
